name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release from, for example v1.2.3"
        required: true
        type: string

# goreleaser creates the GitHub release and pushes nothing else.
permissions:
  contents: write

# One release per tag. Overlapping runs are serialised rather than cancelled:
# cancelling a half-finished goreleaser run would leave a truncated release.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve tag
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no tag to release (set the 'tag' input when dispatching manually)"
            exit 1
          fi
          echo "releasing $TAG"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # Cheap insurance for a path that only ever runs on a tag: find out here,
      # on the gate, rather than after the release job has started creating a
      # GitHub release. `check` does not build, so it stays fast.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  release:
    name: goreleaser
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Pinned to the v2 line that .goreleaser.yaml declares rather than
          # `latest`: a release should be built by a known goreleaser, not by
          # whatever happens to be newest on the day the tag is pushed.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No asset-upload step here on purpose. goreleaser creates the GitHub
      # release and uploads its own artifacts to it: the six archives, the four
      # linux packages and checksums.txt. Re-uploading those same files with a
      # second action adds nothing, and GitHub rejects an asset whose name
      # already exists on a release, so the step could only ever turn a
      # successful release into a red check. The per-target binaries under
      # dist/modharbor_<os>_<arch>/ are build intermediates, not release
      # assets, and are deliberately not uploaded.